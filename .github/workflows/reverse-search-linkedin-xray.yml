name: Reverse Search — LinkedIn X-ray (Monthly)

on:
  # Schedule disabled 2026-09-16: switched search step to Serper (real Google SERP,
  # via API — see job_reversed_search/README.md for why: Google's own Custom Search
  # JSON API is closed to new customers and shuts down entirely 2027-01-01). No GCP
  # billing needed for this, but re-enable the schedule below only after a manual
  # workflow_dispatch run confirms the Serper request format actually works.
  # schedule:
  #   - cron: '0 6 1 * *'  # 1er de chaque mois, 06:00 UTC (~08:00 Paris en ete, ~07:00 en hiver)
  workflow_dispatch:
    inputs:
      test_query:
        description: "Optional: run this single Serper query and print results only (no Sheet write) — for debugging query syntax"
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "job_reversed_search"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r linkedin-xray-requirements.txt

      - name: Run job watch
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TEST_QUERY: ${{ inputs.test_query }}
        run: python linkedin-xray-scripts/linkedin_job_watch.py
