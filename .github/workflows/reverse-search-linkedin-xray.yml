name: Reverse Search — LinkedIn X-ray (Monthly)

on:
  # Schedule disabled 2026-09-15: blocked on GOOGLE_API_KEY requiring a GCP billing
  # account (Custom Search JSON API returns 403 "forbidden" without one). Re-enable
  # the schedule below once that's resolved (billing linked, or the search step is
  # swapped to PhantomBuster). Manual runs via workflow_dispatch still work for testing.
  # schedule:
  #   - cron: '0 6 1 * *'  # 1er de chaque mois, 06:00 UTC (~08:00 Paris en ete, ~07:00 en hiver)
  workflow_dispatch: {}  # permet de le relancer manuellement depuis l'onglet Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "job_reversed_search"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r linkedin-xray-requirements.txt

      - name: Run job watch
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python linkedin-xray-scripts/linkedin_job_watch.py
